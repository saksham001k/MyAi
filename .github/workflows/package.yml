name: Package portable app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --onedir --name MyAi --add-data "web:web" run.py
      - run: python scripts/assemble_package.py
      - run: python scripts/package_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: MyAi-${{ runner.os }}-${{ runner.arch }}
          path: dist/MyAi-*.zip
          if-no-files-found: error
  bundle:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: MyAi-*
      - run: python scripts/combine_portable.py
      - uses: actions/upload-artifact@v4
        with:
          name: MyAi-Portable
          path: |
            dist/MyAi-Portable.zip
            dist/SHA256SUMS.txt
      - name: Publish verified portable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create portable-${{ github.run_id }}-${{ github.run_attempt }}
          dist/MyAi-Portable.zip dist/SHA256SUMS.txt
          --target ${{ github.sha }}
          --title "MyAi Portable build ${{ github.run_number }}"
          --notes-file docs/PORTABLE-RELEASE.md
          --prerelease
