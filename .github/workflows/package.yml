name: Package portable app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --onedir --name MyAi --add-data "web:web" run.py
      - run: python scripts/assemble_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: MyAi-${{ runner.os }}-${{ runner.arch }}
          path: dist/MyAi/
          if-no-files-found: error
