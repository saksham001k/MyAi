<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">KISS</title>
  <desc id="desc">KISS local offline AI workspace logo with a radiant neural node</desc>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#0b0f19" stroke="#00f2fe" stroke-opacity=".35"/>
  <path d="M18 16v32M18 33l25-17M18 33l26 15" fill="none" stroke="url(#core)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 25a10 10 0 0 0 0 16" fill="none" stroke="#4facfe" stroke-width="2" stroke-opacity=".8"/>
  <circle cx="18" cy="33" r="5" fill="#00f2fe" filter="url(#glow)"/>
  <text x="79" y="45" fill="#edf2f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700" letter-spacing="5">KISS</text>
